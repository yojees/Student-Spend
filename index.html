                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch || pFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  }
                });
              }
            }
          } catch (err) {}
        }
      })();
